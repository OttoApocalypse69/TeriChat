[package]
name = "tericrypt"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "TeriCrypt-4096 device cryptography: identities and sealed 1:1 envelopes (Alpha PoC)"

[lints]
workspace = true

[features]
default = []
# Synthetic client-local experiment; not a production protocol switch.
mls-foundation = ["dep:openmls", "dep:openmls_rust_crypto", "dep:openmls_basic_credential", "dep:openmls_traits"]
# Encrypted SQLite persistence for the MLS experiment (issue #6 S1).
# Still synthetic and client-local: NOT a production readiness claim.
mls-persist = [
    "mls-foundation",
    "dep:sqlx",
    "dep:argon2",
    "dep:tokio",
    "dep:serde_json",
]

[dependencies]
openmls = { version = "=0.9.0", optional = true }
openmls_rust_crypto = { version = "=0.6.0", optional = true }
openmls_basic_credential = { version = "=0.6.0", optional = true }
openmls_traits = { version = "=0.6.0", optional = true }
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
zeroize = "1"
bip39 = "=2.2.2"
# Encrypted MLS persistence (mls-persist): every crate below is already in
# Cargo.lock (verified before use). Enabling the feature adds edges only —
# `cc` arrives via the bundled SQLite build (`libsqlite3-sys`).
# sqlx "sqlite" pulls the bundled SQLite build; runtime-tokio drives the
# synchronous OpenMLS StorageProvider trait via an internal runtime.
sqlx = { version = "0.8", optional = true, default-features = false, features = [
    "runtime-tokio",
    "sqlite",
] }
# Same Argon2id baseline as apps/server password hashing.
argon2 = { version = "0.5", optional = true }
tokio = { version = "1", optional = true, features = ["rt", "rt-multi-thread"] }
serde_json = { version = "1", optional = true }
