[package]
name = "terichat-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7", "serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid"] }
dotenvy = "0.15"
argon2 = { version = "0.5", features = ["std"] }
password-hash = "0.5"
# Explicit so `OsRng` in password.rs never depends on transitive feature
# unification (password-hash/rand_core `getrandom`); see review on wt/password.
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
