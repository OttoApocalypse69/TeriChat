name: ci

on:
  push:
  pull_request:

jobs:
  baseline:
    runs-on: ubuntu-latest
    # The workspace suite includes mandatory service-backed regressions.
    # Provision a synthetic database rather than allowing tests to skip.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: baseline_test
          POSTGRES_PASSWORD: baseline_synthetic_only
          POSTGRES_DB: baseline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baseline_test -d baseline_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://baseline_test:baseline_synthetic_only@localhost:5432/baseline_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Build
        run: cargo build --workspace

  arm64-verify:
    # This runner shares the Oracle A1 host with staging services, so keep the
    # job compile-only: no Docker socket, sudo, staging credentials, or DB access.
    # Fork PRs are deliberately excluded from the persistent self-hosted host.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, oracle-a1]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
      - name: Runner identity
        run: |
          uname -a
          rustc -vV
      - name: ARM64 workspace check
        run: cargo check --workspace --all-targets
      - name: Compile test targets
        run: cargo test --workspace --no-run

  db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: terichat
          POSTGRES_PASSWORD: terichat_dev_pw
          POSTGRES_DB: terichat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U terichat -d terichat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://terichat:terichat_dev_pw@localhost:5432/terichat
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
          components: rustfmt, clippy
      # sqlx-cli pinned to 0.8.6 to match the sqlx 0.8 runtime (Cargo.lock: sqlx 0.8.6).
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.8.6 --no-default-features --features postgres
      - name: Migrate
        run: sqlx migrate run
      - name: Tests (db)
        run: DATABASE_URL=postgres://terichat:terichat_dev_pw@localhost:5432/terichat cargo test --workspace
