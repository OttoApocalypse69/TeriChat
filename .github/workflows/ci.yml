name: ci

on:
  push:
  pull_request:

jobs:
  baseline:
    runs-on: ubuntu-latest
    # The workspace suite includes mandatory service-backed regressions.
    # Provision a synthetic database rather than allowing tests to skip.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: baseline_test
          POSTGRES_PASSWORD: baseline_synthetic_only
          POSTGRES_DB: baseline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baseline_test -d baseline_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://baseline_test:baseline_synthetic_only@localhost:5432/baseline_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Build
        run: cargo build --workspace

  arm64-verify:
    # Owner-approved trusted-main verification only on the shared Oracle host.
    # Compilation executes build scripts/macros: compile-only is NOT isolation.
    # Never schedule PRs (including same-repository PRs), tags or feature pushes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, oracle-a1]
    concurrency:
      group: arm64-trusted-main-${{ github.repository }}
      cancel-in-progress: true
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.97"
      - name: Runner identity
        run: |
          uname -a
          rustc -vV
      - name: ARM64 workspace check
        run: cargo check --workspace --all-targets --locked
      - name: Compile test targets
        run: cargo test --workspace --no-run --locked

  db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: terichat
          POSTGRES_PASSWORD: terichat_dev_pw
          POSTGRES_DB: terichat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U terichat -d terichat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://terichat:terichat_dev_pw@localhost:5432/terichat
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
          components: rustfmt, clippy
      # sqlx-cli pinned to 0.8.6 to match the sqlx 0.8 runtime (Cargo.lock: sqlx 0.8.6).
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.8.6 --no-default-features --features postgres
      - name: Migrate
        run: sqlx migrate run
      - name: Tests (db)
        run: DATABASE_URL=postgres://terichat:terichat_dev_pw@localhost:5432/terichat cargo test --workspace
